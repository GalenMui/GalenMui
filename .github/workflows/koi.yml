name: Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml
      - .github/scripts/animate_intro.py

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Generate customized koi
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git clone --quiet --depth 1 --branch v1.0.2 \
            https://github.com/yalongwastaken/git-koi.git \
            "$RUNNER_TEMP/git-koi"

          cd "$RUNNER_TEMP/git-koi"

          # Lower growth requirements
          sed -i \
            -e 's/FULL_COLOR_CONTRIBUTIONS: u64 = 500;/FULL_COLOR_CONTRIBUTIONS: u64 = 100;/' \
            -e 's/YOUNG_SHAPE_CONTRIBUTIONS: u64 = 1_500;/YOUNG_SHAPE_CONTRIBUTIONS: u64 = 300;/' \
            -e 's/ADULT_CONTRIBUTIONS: u64 = 12_750;/ADULT_CONTRIBUTIONS: u64 = 2_500;/' \
            -e 's/MAX_GROWTH_CONTRIBUTIONS: u64 = 100_000;/MAX_GROWTH_CONTRIBUTIONS: u64 = 10_000;/' \
            src/koi.rs

          # Always swim in a circle
          sed -i \
            's/let behavior = select_behavior(&koi_development);/let behavior = Behavior::Cruise;/' \
            src/main.rs

          # Use fully grown koi anatomy, retaining real activity colors
          sed -i '/^fn calculate_anatomy(total_contributions: u64) -> KoiAnatomy {/a\    let total_contributions = total_contributions.max(10_000);' src/render.rs

          # Slimmer adult koi proportions
          sed -i 's/const ADULT_BODY_WIDTH_FRACTION: f64 = 0.2;/const ADULT_BODY_WIDTH_FRACTION: f64 = 0.18;/' src/render.rs
          sed -i 's/const MATURE_BODY_WIDTH_GAIN: f64 = 0.045;/const MATURE_BODY_WIDTH_GAIN: f64 = 0.010;/' src/render.rs

          # Smaller koi, naturally wider circular swimming path
          sed -i '/^    let body_width_fraction = interpolate(/i\    let body_length_pixels = body_length_pixels * 0.52;' src/render.rs
          grep -Fq 'let body_length_pixels = body_length_pixels * 0.52;' src/render.rs

          cargo build --release --locked

          ./target/release/git-koi collect \
            "$GITHUB_REPOSITORY_OWNER" \
            --output "$RUNNER_TEMP/koi-snapshot.json"

          ./target/release/git-koi render \
            "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir "$GITHUB_WORKSPACE/koi" \
            --body asagi

      - name: Generate intro animation
        run: |
          python -m pip install --quiet pillow
          python .github/scripts/animate_intro.py assets/intro.gif

      - name: Commit koi
        shell: bash
        run: |
          git add koi/koi.gif assets/intro.gif
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "koi: refresh customized koi"
          git push
